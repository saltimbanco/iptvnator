<!doctype html>
<!-- Relay test page (spike). ?mode=live plays live.ts with mpegts.js (the
     web players' TS path); ?mode=timeshift plays timeshift.m3u8 with hls.js.
     window.spike exposes state for the Playwright probe. -->
<html>
<body style="margin:0;background:#000">
<video id="v" muted autoplay playsinline style="width:1280px;height:720px"></video>
<script src="vendor/mpegts.js"></script>
<script src="vendor/hls.min.js"></script>
<script>
    const mode = new URLSearchParams(location.search).get('mode') ?? 'live';
    const video = document.getElementById('v');
    window.spike = { mode, errors: [] };
    const target = new URLSearchParams(location.search).get('target') ?? '2';
    window.spike.reloads = 0;
    if (mode === 'live') {
        // live.ts ends at a recording-segment boundary (timestamps restart),
        // so the view reopens it, as the app's relay view would.
        const start = () => {
            const player = mpegts.createPlayer(
                { type: 'mpegts', isLive: true, url: 'live.ts' },
                { enableStashBuffer: false, liveBufferLatencyChasing: true }
            );
            player.on(mpegts.Events.ERROR, (...e) => window.spike.errors.push(e.join(' ')));
            player.on(mpegts.Events.LOADING_COMPLETE, () => {
                window.spike.reloads++;
                setTimeout(() => { player.destroy(); start(); }, 100);
            });
            player.attachMediaElement(video);
            player.load();
            player.play();
        };
        start();
    } else {
        const hls = new Hls({ liveSyncDurationCount: 2 });
        hls.on(Hls.Events.ERROR, (_, d) => d.fatal && window.spike.errors.push(d.details));
        hls.loadSource(`timeshift.m3u8?target=${target}`);
        hls.attachMedia(video);
        video.play();
        window.spike.hls = hls;
    }
</script>
</body>
</html>
